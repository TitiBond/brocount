<div class="rounded-2xl border border-gray-700 bg-gray-800 p-5">
  <div class="flex items-center justify-between">
    <span class="text-sm text-gray-400">{{ infoCardOptions().title | titlecase }}</span
    ><span
      class="material-icons-outlined text-gray-400"
      [class.text-gray-400]="infoCardOptions().icon.color === 'gray'"
      [class.text-lime-400]="infoCardOptions().icon.color === 'green'"
      >{{ infoCardOptions().icon.name }}</span
    >
  </div>
  <div id="stat-total" class="mt-3 text-3xl font-extrabold">{{ infoCardOptions().value }}</div>
  <div class="mt-2 text-xs text-gray-400">{{ infoCardOptions().subtile | titlecase }}</div>
</div>
