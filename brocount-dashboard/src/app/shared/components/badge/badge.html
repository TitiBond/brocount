<span
  class="rounded-full px-2.5 py-1 text-xs font-bold cursor-default"
  [class.bg-lime-400/15]="badgeOption().color === 'green'"
  [class.text-lime-300]="badgeOption().color === 'green'"
  [class.bg-sky-400/10]="badgeOption().color === 'blue'"
  [class.text-sky-300]="badgeOption().color === 'blue'"
  [class.bg-gray-700]="badgeOption().color === 'gray'"
  [class.text-gray-300]="badgeOption().color === 'gray'"
  >{{ badgeOption().label | uppercase }}</span
>
