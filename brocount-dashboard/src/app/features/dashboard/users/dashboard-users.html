<div class="mb-7 flex flex-col justify-between gap-4 xl:flex-row xl:items-end">
  <div>
    <h2 class="text-2xl font-bold">Gestion des comptes</h2>
    <p class="mt-2 text-sm text-gray-400">Consultez et gérez les utilisateurs de Brocount.</p>
  </div>
  <button
    onclick="toast('Prototype : le bouton Ajouter sera connecté au backend plus tard.')"
    class="flex items-center justify-center gap-2 rounded-xl bg-lime-400 px-4 py-3 font-bold text-gray-900 shadow hover:bg-lime-300"
  >
    <span class="material-icons-outlined">person_add</span>Ajouter un utilisateur
  </button>
</div>

<div class="mb-7 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
  @for (card of cards; track card.title) {
    <bc-info-card [infoCardOptions]="card"></bc-info-card>
  }
</div>

@for (user of userList(); track user.id) {
  <span class="text-gray-50"
    >{{ user.email }} | {{ user.id }} | {{ user.role }} | {{ user.createdAt | date: 'd/M/yy' }} |
    {{ user.lastLoginAt | date: 'd/M/yy' }}</span
  >
}
