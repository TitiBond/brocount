<div class="mb-7 flex flex-col justify-between gap-4 xl:flex-row xl:items-end">
  <div>
    <h2 class="text-2xl font-bold">Gestion des comptes</h2>
    <p class="mt-2 text-sm text-gray-400">Consultez et gérez les utilisateurs de Brocount.</p>
  </div>
  <bc-button [buttonOption]="refreshButtonOption"></bc-button>
</div>

<div class="mb-7 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
  @for (card of cards(); track card.title) {
    <bc-info-card [infoCardOptions]="card"></bc-info-card>
  }
</div>

<div class="overflow-hidden rounded-2xl border border-gray-700 bg-gray-800">
  <div
    class="flex flex-col gap-4 border-b border-gray-700 p-5 xl:flex-row xl:items-center xl:justify-between"
  >
    <div>
      <h3 class="text-lg font-bold">Liste des utilisateurs</h3>
      <p class="mt-1 text-sm text-gray-400">
        <span>{{ filteredUsers().length }}</span>
        comptes affichés
      </p>
    </div>
    <div class="flex flex-col gap-3 sm:flex-row">
      <bc-input [inputOption]="inputOption" (onChange)="onInputChange($event)"></bc-input>
      <select
        id="role-filter"
        [value]="selectedRole()"
        (change)="onSelectRole($event)"
        class="rounded-xl border border-gray-700 bg-gray-900 px-3 py-2.5 text-sm outline-none focus:border-lime-400"
      >
        <option value="">Tous les rôles</option>
        <option value="ADMIN">ADMIN</option>
        <option value="MODERATOR">MODERATOR</option>
        <option value="USER">USER</option>
      </select>
    </div>
  </div>
  <div class="overflow-x-auto">
    <bc-users-table
      [users]="filteredUsers()"
      (onEditUser)="onEditUser($event)"
      (onDeleteUser)="onDeleteUser($event)"
    ></bc-users-table>
  </div>
  <div
    class="flex flex-col gap-3 border-t border-gray-700 px-5 py-4 text-sm text-gray-400 sm:flex-row sm:items-center sm:justify-between"
  >
    <span id="pagination-label">Affichage de 1 à 8 sur 8 résultats de démonstration</span>
    <div class="flex gap-2">
      <button
        onclick="toast('Prototype : pagination à connecter.')"
        class="rounded-lg border border-gray-700 px-3 py-2 hover:bg-gray-700"
      >
        Précédent</button
      ><button class="rounded-lg bg-lime-400 px-3 py-2 font-bold text-gray-900">1</button
      ><button
        onclick="toast('Prototype : pagination à connecter.')"
        class="rounded-lg border border-gray-700 px-3 py-2 hover:bg-gray-700"
      >
        Suivant
      </button>
    </div>
  </div>
</div>
