<div class="h-full w-full flex flex-col gap-5 justify-center items-center bg-gray-900 px-4">
  <!-- HEADER -->
  <div class="flex justify-center items-center flex-col">
    <div class="p-4 bg-lime-400 rounded-2xl flex items-center justify-center">
      <span class="material-icons-outlined">snippet_folder</span>
    </div>

    <span class="text-white text-2xl">Brocount</span>
    <span class="text-sm text-gray-400">Administration</span>
  </div>

  <!-- FORM -->
  <form
    class="w-full max-w-md p-6 bg-gray-800 rounded-md flex flex-col gap-4"
    (ngSubmit)="onSubmit()"
  >
    <!-- FORM HEADER -->
    <div class="flex flex-col gap-1">
      <h1 class="text-white text-lg font-semibold">Connexion</h1>
      <p class="text-sm text-gray-400">Connectez-vous à votre espace administrateur.</p>
    </div>

    <!-- EMAIL -->
    <div class="flex flex-col gap-1">
      <label class="text-white" for="email"> Adresse e-mail </label>

      <input
        id="email"
        name="email"
        type="email"
        [ngModel]="_email()"
        (ngModelChange)="_email.set($event)"
        placeholder="Adresse e-mail"
        autocomplete="username"
        required
        class="w-full border border-gray-700 rounded-md py-3 px-3 bg-gray-900 text-white placeholder:text-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
      />
    </div>

    <!-- PASSWORD -->
    <div class="flex flex-col gap-1">
      <label class="text-white" for="password"> Mot de passe </label>

      <input
        id="password"
        name="password"
        type="password"
        [ngModel]="_password()"
        (ngModelChange)="_password.set($event)"
        placeholder="Mot de passe"
        autocomplete="current-password"
        required
        class="w-full border border-gray-700 rounded-md py-3 px-3 bg-gray-900 text-white placeholder:text-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
      />
    </div>

    @if (_errorMessage()) {
      <p class="text-sm text-red-400" role="alert">
        {{ _errorMessage() }}
      </p>
    }

    <!-- SUBMIT -->
    <button
      type="submit"
      [disabled]="_isLoading()"
      class="w-full rounded-md py-3 px-3 bg-lime-400 text-gray-900 font-semibold hover:bg-lime-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-lime-400 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      @if (_isLoading()) {
        Connexion en cours...
      } @else {
        Se connecter
      }
    </button>
  </form>
</div>
